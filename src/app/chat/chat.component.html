<div class="chat-container">
    <div class="header">
        Prince ChatbotAI

        <!-- <button (click)="toggleSpeakReplies()" class="toggle-audio">
        {{ speakReplies ? '🔊 Voice Reply ON' : '🔇 Voice Reply OFF' }}
      </button>
      <button type="button" (click)="stopSpeaking()" class="stop-voice-button">
        <mat-icon>volume_off</mat-icon>
      </button> -->

    </div>

    <div class="messages" #scrollMe>
        <div *ngFor="let msg of chatHistory" [ngClass]="msg.type">
            <markdown *ngIf="msg.type === 'bot'" [data]="msg.text"></markdown>
            <div *ngIf="msg.type === 'user'" class="msg">{{ msg.text }}</div>
        </div>
    </div>

    <div *ngIf="isListening" class="listening-indicator">
        <mat-icon class="pulse-icon">graphic_eq</mat-icon>
        <span>Listening...</span>
    </div>



    <div class="input-area">
        <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" autofocus placeholder="Ask something..." style="outline: none;"/>
        <button *ngIf="userInput" (click)="sendMessage()">
            <mat-icon>arrow_upward</mat-icon>
        </button>
        <button *ngIf="!userInput" (click)="startVoice()">
            <mat-icon>mic</mat-icon>
        </button>
    </div>
</div>
